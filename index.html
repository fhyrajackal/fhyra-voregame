<style>:root{--plum:#4a3d63;--plum2:#2e2540;--lav:#b7a6d4;--cream:#f6ecd2;--orange:#d0702a;--tan:#d99a5b;--gray:#807a76;--char:#2b2629;--gold:#f0b33a;--gold2:#ffd57a;--turq:#3fc4d8;--rose:#f4a090;--red:#d8434a;--ink:#f6ecd2;--panel:rgba(30,22,40,.82);--line:rgba(240,179,58,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#241c31;transition:background .8s;overflow:hidden}
body.r-woods{background:radial-gradient(ellipse at 50% 120%,#4f7a3a 0%,#1f3a26 40%,#0f1a14 85%)}
body.r-dunes{background:radial-gradient(ellipse at 50% 120%,#c9853e 0%,#6b3f2a 35%,#2b1f33 80%)}
body.r-steppes{background:radial-gradient(ellipse at 50% 120%,#8a7d68 0%,#3f3830 40%,#1a1714 85%)}
body.r-bazaar{background:radial-gradient(ellipse at 50% 120%,#1e8a8f 0%,#13404f 40%,#101a2e 85%)}
body.r-laby{background:radial-gradient(ellipse at 50% 120%,#7f8db8 0%,#2c3352 40%,#0e1020 85%)}
body.r-necro{background:radial-gradient(ellipse at 50% 120%,#a5762e 0%,#4a3420 40%,#1a1514 85%)}
body.r-peaks{background:radial-gradient(ellipse at 50% 120%,#c2452a 0%,#4d1a14 40%,#160807 85%)}
body.r-stars{background:radial-gradient(ellipse at 50% 120%,#7a3fa0 0%,#2b1650 40%,#0b0718 85%)}
body.r-hall{background:radial-gradient(ellipse at 50% 120%,#c9a548 0%,#3a2e14 35%,#050403 80%)}
body.inside{background:radial-gradient(ellipse at 50% 50%,#7a2335 0%,#3b0d1c 60%,#140308 100%)!important}
body.r-laby::before,body.r-hall::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#ffe,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent);background-size:300px 300px;opacity:.6}
h1,h2,h3,.fname,.rnum,.btn.big,.gulpbig{font-family:'Cinzel Decorative','Cinzel',serif}
#app{display:grid;grid-template-columns:330px 1fr;height:100vh;max-width:1500px;margin:0 auto;gap:10px;padding:10px}
#app.notitle{grid-template-columns:1fr}
#app.notitle #side,#app.notitle #hud,#app.notitle #log{display:none}
#side{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
#main{display:flex;flex-direction:column;min-height:0;gap:8px}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);position:relative}
.pan::after{content:"☥ ✦ ☥ ✦ ☥";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--gold);background:#2a2036;padding:0 8px;border-radius:6px;letter-spacing:2px;white-space:nowrap;opacity:.9}
#fhy .top{display:flex;gap:10px;align-items:flex-start}
.portrait{width:112px;height:112px;flex:none;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 3px #2a2036,0 0 22px rgba(240,179,58,.5);position:relative;background:var(--lav)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform .25s}
.portrait img.f-grin{transform:scale(1.08)}
.portrait img.f-tongue{transform:rotate(-4deg) scale(1.05)}
#gulpfx{position:absolute;inset:0;border-radius:50%;pointer-events:none}
#gulpfx.go{animation:gulpring .6s ease-out}
@keyframes gulpring{0%{box-shadow:inset 0 0 0 0 rgba(240,179,58,.9)}100%{box-shadow:inset 0 0 0 60px rgba(240,179,58,0)}}
.fname{font-size:20px;color:var(--gold2);letter-spacing:2px;line-height:1}
.fname small{display:block;font-family:'Nunito';font-size:11px;letter-spacing:0;color:var(--lav);margin-top:3px}
#bubble{margin-top:8px;background:var(--cream);color:#3a2a20;border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.35;position:relative;min-height:54px;font-style:italic}
#bubble::before{content:"";position:absolute;left:-7px;top:12px;border:7px solid transparent;border-right-color:var(--cream);border-left:0}
#bubble.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}
.meter{margin-top:10px;display:flex;align-items:center;gap:8px}
.meter>div{flex:1}
#mood{font-size:11px;color:var(--gold2);white-space:nowrap;font-style:normal}
.bar{position:relative;height:16px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.12);margin:4px 0}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .4s}
.bar span{position:relative;display:block;text-align:center;font-size:10.5px;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.bar.fav i{background:linear-gradient(90deg,#c27b1a,var(--gold),#ffe39a)}
.bar.hp i{background:linear-gradient(90deg,#a3262f,#e0584d)}
.bar.faith i{background:linear-gradient(90deg,#2b7b9c,var(--turq))}
.bar.xp i{background:linear-gradient(90deg,#6b4fa3,#b18cf0)}
.bar.dev i{background:linear-gradient(90deg,#c2566b,var(--rose))}
.bar.ehp i{background:linear-gradient(90deg,#8e2230,#e3604a)}
.bar.dig{height:13px}.bar.dig span{font-size:9.5px;line-height:12px}
.bar.dig i{background:linear-gradient(90deg,#7c4a2a,var(--tan),#f2d29a)}
.bar.dig.big{height:24px}.bar.dig.big span{font-size:13px;line-height:23px}
#belly{margin-top:10px}
.bellyhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--gold2);font-size:13px;letter-spacing:.5px}
#pips{display:flex;gap:3px;margin:6px 0}
#pips i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12)}
#pips i.on{background:var(--tan);box-shadow:0 0 6px rgba(217,154,91,.8)}
.bellyrow{display:flex;gap:10px;align-items:flex-start}
#bellyorb{--fill:0;width:96px;height:96px;flex:none;border-radius:50%;position:relative;overflow:hidden;background:var(--tummy) center/cover;border:3px solid var(--gold);box-shadow:inset -8px -10px 18px rgba(120,40,40,.35),0 0 14px rgba(240,179,58,.3);transform:scale(calc(.9 + var(--fill)*.18));transition:transform .6s}
#bellyorb::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--fill)*100%);background:linear-gradient(180deg,rgba(255,170,150,0),rgba(170,50,60,.35));transition:height .6s}
#bellyorb .inside{position:absolute;inset:0}
#bellyorb .inside span{position:absolute;font-size:20px;transform:translate(-50%,-50%);animation:squirm 2.2s ease-in-out infinite;animation-delay:var(--d);filter:saturate(.8)}
@keyframes squirm{0%,100%{transform:translate(-50%,-50%) rotate(-12deg)}50%{transform:translate(-40%,-60%) rotate(12deg) scale(.92)}}
#bellyorb.wob{animation:wob .7s}
@keyframes wob{0%{transform:scale(1)}25%{transform:scale(1.12,.92)}50%{transform:scale(.94,1.08)}75%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
#bellyl{flex:1;max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.bitem{display:flex;gap:6px;align-items:center;font-size:12px}
.bitem>b{font-size:20px}
.bitem>div{flex:1;min-width:0}
.bitem .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem.left{opacity:.75}
.bitem em{color:var(--gray);font-size:10px}
.empty{font-size:12px;color:var(--lav);font-style:italic;padding:4px}
#foxp .top{display:flex;gap:10px;align-items:center}
#servsvg{width:62px;height:62px;flex:none}#servsvg svg{width:62px;height:62px;background:rgba(0,0,0,.25);border-radius:50%;border:2px solid var(--sc,var(--orange))}
#fxname{font-weight:800;font-size:16px}
#fxname small{display:block;font-weight:600;color:var(--lav);font-size:11px}
#fxdev{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--rose);white-space:nowrap}
#fxdev .bar{flex:1}
#fxst{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:10.5px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:1px 7px;white-space:nowrap}

function runEvent() {
  screen = 'event'; BTN = {};
  if (G.flags.dreadOn && Math.random() < 0.45) { tributeEvent(); return; }
  let pool = EVENTS.filter(e => (!e.realms || e.realms.includes(G.realm)) && !(e.once && G.seenEv[e.id]));
  if (G.realm === 5) { const dv = pool.filter(e => e.realms && e.realms.includes(5) && !G.seenEv[e.id]); if (dv.length && Math.random() < 0.7) pool = dv; }
  const fresh = pool.filter(e => !G.seenEv[e.id]); if (fresh.length) pool = fresh;
  const ev = pick(pool); G.seenEv[ev.id] = (G.seenEv[ev.id] || 0) + 1;
  const r = ev.run();
  stage(`<div class="room event"><div class="ricon">${ev.i}</div><h2>${ev.t}</h2><p>${r.text}</p><div class="choices">${r.ch.map((c, i) => btn(`${c.l}${c.s ? `<small>${c.s}</small>` : ''}`, () => {
    const res = c.f();
    if (res && res.battle) { startBattle(res.battle, { elite: res.elite }); return; }
    renderSide();
    BTN = {}; stage(`<div class="room event"><div class="ricon">${ev.i}</div><h2>${ev.t}</h2><p>${res}</p>${btn('Continue', finishNode, 'big gold')}</div>`);
  })).join('')}</div></div>`);
}

async function scene(title, icons, msgs, squirm = true) {
  screen = 'gut'; renderSide(); BTN = {};
  stage(`<div class="gut"><div class="bigtum ${squirm ? 'squirm' : 'wob2'}"><img src="${TUMMY}"><span class="tb">${icons}</span></div><h2>${title}</h2><div class="gutmsgs" id="gm"></div></div>`);
  for (const m of msgs) {
    const gm = $('#gm'); if (!gm) return;
    const p = document.createElement('p'); p.innerHTML = m; gm.appendChild(p); gm.scrollTop = gm.scrollHeight;
    SFX.gurgle(); bellyWobble(); await sleep(2700);
  }
  const t = document.querySelector('.bigtum'); if (t) t.classList.remove('squirm');
  await sleep(900);
}

function meta() { try { return JSON.parse(localStorage.getItem(MKEY) || '{}'); } catch (e) { return {}; } }
function markBeaten() { try { const m = meta(); m.beaten = 1; localStorage.setItem(MKEY, JSON.stringify(m)); } catch (e) { } }
const isBeaten = () => !!(meta().beaten || (G && G.flags && G.flags.divine));
const DIVINE_IDS = () => new Set([...REALMS[5].pool, ...REALMS[5].elites, 'ra', 'nefertem', 'minorgod']);
function showMenu() {
  const dv = DIVINE_IDS(), full = isBeaten();
  const all = Object.entries(E).filter(([k, e]) => e.hp && k !== 'fox' && (full || !dv.has(k)));
  const t = G ? G.tasted : {}; const n = all.filter(([k]) => t[k]).length;
  modal(`<h3>🍽️ Fhyra's Tasting Menu</h3><p class="dim">${n} / ${all.length} species tasted (alive). ${n >= 30 ? '✦ Gourmand status achieved.' : 'Devour 30 for a secret~'}</p>${full ? '' : '<p class="dim" style="font-size:12px">Some morsels are not yet shown on the menu.</p>'}
  <div class="menu">${all.map(([k, e]) => t[k] ? `<div class="mcard"><div class="mi">${e.i}</div><b>${esc(e.n)}</b><small>×${t[k]}</small><p>${esc(e.taste)}</p><em>${e.fl ? e.fl[2] : ''}</em></div>` : `<div class="mcard un"><div class="mi">❔</div><b>???</b><p>Not yet tasted.</p></div>`).join('')}</div>`);
}

// ================= BOOT =================
function boot() {
  $('#sndb').onclick = () => { SOUND = !SOUND; $('#sndb').textContent = SOUND ? '🔊' : '🔇'; };
  $('#spdb').onclick = () => { SPEED = SPEED === 1 ? 0.5 : 1; $('#spdb').textContent = SPEED === 1 ? '▶' : '⏩'; };
  $('#helpb').onclick = showHelp;
  $('#menub').onclick = () => G && showMenu();
  $('#bagb').onclick = () => G && showBag();
  $('#statb').onclick = () => G && showStatus();
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && $('#modal .mx')) closeModal(); });
  $('#face').src = FACES.smug;
  setInterval(() => { const s = $('.fname small'); if (s) s.innerHTML = capF(T()); }, 9000);
  showTitle();
}
window.addEventListener('DOMContentLoaded', boot);
</script>
